#
# NonOfficial development entry point for testing dotnet new template changes
# from an unmerged branch. This pipeline cannot sign or publish its package.

name: DotnetNewTemplatesDev-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none

parameters:
- name: WindowsAppSDKVersion
  displayName: 'WindowsAppSDK version for template validation (* = latest stable)'
  type: string
  default: '*'

variables:
- template: AzurePipelinesTemplates\WindowsAppSDK-Versions.yml@WindowsAppSDKVersionConfig
- template: WindowsAppSDK-CommonVariables.yml

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main
    - repository: WindowsAppSDKConfig
      type: git
      name: ProjectReunion/WindowsAppSDKConfig
      ref: refs/heads/main
    - repository: WindowsAppSDKVersionConfig
      type: git
      name: ProjectReunion/WindowsAppSDKConfig
      ref: refs/heads/main

extends:
  template: v2/Microsoft.NonOfficial.yml@templates
  parameters:
    featureFlags:
      EnableCDPxPAT: false
      WindowsHostVersion:
        Version: 2022
        Network: R1

    platform:
      name: 'windows_undocked'

    cloudvault:
      enabled: false

    globalSdl:
      tsa:
        enabled: false
      isNativeCode: false
      psscriptanalyzer:
        enable: false
      tsandjs:
        enabled: false
      python:
        enabled: false
      credscan:
        enable: false
      policheck:
        enable: false
      binskim:
        enabled: false
      prefast:
        enabled: false
      apiscan:
        enabled: false

    stages:
    - template: AzurePipelinesTemplates\WindowsAppSDK-DotnetNewTemplates-Stages.yml@self
      parameters:
        pool:
          type: windows
        publishToInternalFeed: false
        SignOutput: false
        IsPRBuild: true

    - template: AzurePipelinesTemplates\WindowsAppSDK-DotnetNewTemplates-Test-Stage.yml@self
      parameters:
        pool:
          type: windows
        dependsOnStage: 'DotnetNewTemplates_Build'
        WindowsAppSdkVersion: ${{ parameters.WindowsAppSDKVersion }}
