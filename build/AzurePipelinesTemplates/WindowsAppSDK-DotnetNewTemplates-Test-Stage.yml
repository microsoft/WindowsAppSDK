#
# Stage template: Smoke-test dotnet new templates by scaffolding and building
# each C# project template and all item templates.
#
# This stage runs after DotnetNewTemplates_Build in the main build pipeline
# (WindowsAppSDK-DotnetNewTemplates.yml). It downloads the .nupkg artifact
# produced by the build stage and passes it to Test-DotnetNewTemplates.ps1.

parameters:
- name: pool
  type: object
  default:
    vmImage: 'windows-latest'
- name: sourceSubdirectory
  type: string
  default: 'WindowsAppSDK'
- name: dependsOnStage
  type: string
  default: 'DotnetNewTemplates_Build'
- name: platforms
  type: object
  default:
  - x64
- name: dotnetSdkVersion
  type: string
  default: '8.0.x'
# Reactor project templates target net10.0 and declare a [10.0,) SDK
# constraint, so the test agent also needs the .NET 10 SDK to scaffold and
# build them. Installed alongside dotnetSdkVersion below.
- name: reactorDotnetSdkVersion
  type: string
  default: '10.0.x'
- name: WindowsAppSdkVersion
  type: string
  default: '*'
# Optional gate wiring used by the PR pipeline to short-circuit when no
# dev/Templates files changed. Defaults preserve official-pipeline behavior.
- name: dependsOn
  type: object
  default: []
- name: condition
  type: string
  default: ''

stages:
- stage: DotnetNewTemplates_Test
  displayName: 'Smoke-test dotnet new templates'
  dependsOn:
  - ${{ parameters.dependsOnStage }}
  - ${{ each s in parameters.dependsOn }}:
    - ${{ s }}
  ${{ if ne(parameters.condition, '') }}:
    condition: ${{ parameters.condition }}
  jobs:
  - job: TestDotnetNewTemplates
    displayName: 'Scaffold and build dotnet new templates'
    pool: ${{ parameters.pool }}
    timeoutInMinutes: 60
    variables:
      ob_outputDirectory: '$(Build.ArtifactStagingDirectory)\test-results'
      templateArtifactDir: '$(Pipeline.Workspace)\drop_DotnetNewTemplates_Build_PackDotnetNewTemplates'
    steps:
    - checkout: self

    - download: current
      displayName: 'Download template pack artifact'
      artifact: 'drop_DotnetNewTemplates_Build_PackDotnetNewTemplates'

    - task: UseDotNet@2
      displayName: 'Use .NET SDK ${{ parameters.dotnetSdkVersion }}'
      inputs:
        packageType: sdk
        version: '${{ parameters.dotnetSdkVersion }}'

    # Reactor templates require the .NET 10 SDK (they target net10.0 and set a
    # [10.0,) sdk-version constraint). Install it alongside the version above;
    # the .NET muxer picks the highest installed SDK, and the WinUI templates
    # auto-detect their TFM and build cleanly on .NET 10 as well.
    - task: UseDotNet@2
      displayName: 'Use .NET SDK ${{ parameters.reactorDotnetSdkVersion }} (for Reactor templates)'
      inputs:
        packageType: sdk
        version: '${{ parameters.reactorDotnetSdkVersion }}'

    - task: NuGetAuthenticate@1
      displayName: 'Authenticate NuGet feeds'

    - task: PowerShell@2
      displayName: 'Run template smoke tests'
      inputs:
        targetType: inline
        workingDirectory: '$(Build.SourcesDirectory)\${{ parameters.sourceSubdirectory }}'
        script: |
          $package = Get-ChildItem -Path '$(templateArtifactDir)' -Filter 'Microsoft.WindowsAppSDK*.nupkg' -Recurse | Select-Object -First 1
          if (-not $package) {
            throw "No template .nupkg found under '$(templateArtifactDir)'"
          }
          Write-Host "Using template package: $($package.FullName)"
          $platforms = '${{ join(',', parameters.platforms) }}' -split ','
          & '$(Build.SourcesDirectory)\${{ parameters.sourceSubdirectory }}\dev\Templates\Dotnet\Test-DotnetNewTemplates.ps1' `
            -PackagePath $package.FullName `
            -Platforms $platforms `
            -WindowsAppSdkVersion '${{ parameters.WindowsAppSdkVersion }}' `
            -SkipAppLaunch
      env:
        # Lets the smoke test read the latest official WindowsAppSDK version from
        # the package source when the version is '*'.
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
