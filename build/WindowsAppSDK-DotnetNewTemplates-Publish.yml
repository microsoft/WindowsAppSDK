#
# Usage:
#   1. Run the OneBranch build pipeline (WindowsAppSDK-DotnetNewTemplates.yml) first.
#   2. Note the build ID from that run.
#   3. Run this pipeline, providing the build ID as a parameter.

trigger: none

resources:
  repositories:
  - repository: templates
    type: git
    name: OneBranch.Pipelines/GovernedTemplates
    ref: refs/heads/main

parameters:
- name: "BuildRunId"
  displayName: "Official WindowsAppSDK-DotnetNewTemplates build run ID"
  type: number

variables:
- template: WindowsAppSDK-CommonVariables.yml

extends:
  template: v2/OneBranch.Official.CrossPlat.yml@templates
  parameters:
    release:
      category: NonAzure
    featureFlags:
      WindowsHostVersion:
        Version: 2022
    stages:
    - template: AzurePipelinesTemplates\WindowsAppSDK-DotnetNewTemplates-Publish-Stage.yml@self
      parameters:
        pool:
          type: windows
        buildRunId: ${{ parameters.BuildRunId }}
