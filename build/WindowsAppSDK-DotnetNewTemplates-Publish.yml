#
# Standalone OneBranch release pipeline for publishing dotnet new templates to NuGet.org.
# Packages are verified and staged before approval, then published from a release job.
#
# Usage:
#   1. Run the OneBranch build pipeline (WindowsAppSDK-DotnetNewTemplates.yml) first.
#   2. Note the build ID from that run.
#   3. Run this pipeline with that build ID and ArmPublishToNugetOrg enabled.
#   4. Review the ReleasePackages artifact and approve publishing.

trigger: none
pr: none

parameters:
- name: "BuildPipelineId"
  displayName: "Build pipeline definition ID (from WindowsAppSDK-DotnetNewTemplates pipeline)"
  type: number
  default: 202202
- name: "BuildRunId"
  displayName: "Build run ID to download artifact from"
  type: number
- name: "ArtifactName"
  displayName: "Artifact name from the build pipeline"
  type: string
  default: 'drop_DotnetNewTemplates_Build_PackDotnetNewTemplates'
- name: "ArmPublishToNugetOrg"
  displayName: "Arm publish of dotnet new templates to NuGet.org"
  type: boolean
  default: false

variables:
- template: WindowsAppSDK-CommonVariables.yml

resources:
  repositories:
  - repository: templates
    type: git
    name: OneBranch.Pipelines/GovernedTemplates
    ref: refs/heads/main

extends:
  template: v2/OneBranch.Official.CrossPlat.yml@templates
  parameters:
    release:
      category: NonAzure
    featureFlags:
      WindowsHostVersion:
        Version: 2022
    globalSdl:
      evidence:
        enabled: false
      evidenceV2:
        enabled: true

    stages:
    - stage: DotnetNewTemplates_Prepare
      displayName: 'Prepare dotnet new templates for release'
      jobs:
      - job: PrepareFilesForRelease
        displayName: 'Verify and stage dotnet new template packages'
        pool:
          type: windows
        variables:
          WindowsContainerImage: 'onebranch.azurecr.io/windows/ltsc2022/vse2022:latest'
          ob_outputDirectory: '$(Build.ArtifactStagingDirectory)\ReleasePackages'
          ob_artifactBaseName: 'ReleasePackages'
          dotnetTemplatesArtifactPath: '$(Pipeline.Workspace)\BuildArtifact'
        steps:
        - task: DownloadPipelineArtifact@2
          displayName: 'Download dotnet new template pack artifact'
          inputs:
            buildType: specific
            project: '$(System.TeamProjectId)'
            definition: ${{ parameters.BuildPipelineId }}
            buildVersionToDownload: specific
            pipelineId: ${{ parameters.BuildRunId }}
            artifactName: '${{ parameters.ArtifactName }}'
            targetPath: '$(dotnetTemplatesArtifactPath)'

        - task: NuGetToolInstaller@1
          displayName: 'Use NuGet for package signature verification'
          inputs:
            versionSpec: '7.6.0'

        - task: PowerShell@2
          displayName: 'Verify dotnet new template pack artifacts and signatures'
          inputs:
            targetType: inline
            script: |
              Set-StrictMode -Version 2.0
              $ErrorActionPreference = 'Stop'

              $artifactPath = '$(dotnetTemplatesArtifactPath)'
              if (-not (Test-Path -LiteralPath $artifactPath -PathType Container)) {
                throw "Expected artifact directory '$artifactPath' was not found."
              }
              $packages = Get-ChildItem -LiteralPath $artifactPath -Filter *.nupkg -File
              if (-not $packages) {
                throw "No root-level .nupkg files were found in '$artifactPath'."
              }
              foreach ($package in $packages) {
                Write-Host "Verifying package '$($package.FullName)'."
                & nuget.exe verify $package.FullName -All
                if ($LASTEXITCODE -ne 0) {
                  throw "Signature verification failed for '$($package.FullName)' (exit code $LASTEXITCODE)."
                }
              }

        - task: CopyFiles@2
          displayName: 'Stage verified packages for release'
          inputs:
            SourceFolder: '$(dotnetTemplatesArtifactPath)'
            Contents: '*.nupkg'
            TargetFolder: '$(ob_outputDirectory)'

    - stage: DotnetNewTemplates_Publish
      displayName: 'Approve and publish dotnet new templates to NuGet.org'
      dependsOn:
      - DotnetNewTemplates_Prepare
      variables:
        ob_release_environment: Production
      jobs:
      - job: WaitForPublishApproval
        displayName: 'Manual Approval'
        pool:
          type: server
        timeoutInMinutes: 1441
        steps:
        - task: ManualValidation@0
          displayName: 'Verify artifacts before NuGet.org publish'
          timeoutInMinutes: 1440
          inputs:
            notifyUsers: ''
            onTimeout: reject
            instructions: |
              Please verify the .nupkg files in this run's ReleasePackages artifact before continuing the publish to NuGet.org:
              $(System.CollectionUri)$(System.TeamProjectId)/_build/results?buildId=$(Build.BuildId)&view=artifacts&pathAsName=false&type=publishedArtifacts
              Source build: ${{ parameters.BuildRunId }}
              Source artifact: ${{ parameters.ArtifactName }}

      - ${{ if eq(parameters.ArmPublishToNugetOrg, true) }}:
        - job: PublishNuGetOrg
          displayName: 'Publish dotnet new template pack to NuGet.org'
          dependsOn: WaitForPublishApproval
          pool:
            type: release
          variables:
            dotnetTemplatesArtifactPath: '$(Pipeline.Workspace)\VerifiedReleasePackages'
          templateContext:
            inputs:
            - input: pipelineArtifact
              artifactName: ReleasePackages
              targetPath: '$(dotnetTemplatesArtifactPath)'
              itemPattern: '*.nupkg'
          steps:
          - task: NuGetCommand@2
            displayName: 'Publish dotnet new templates to NuGet.org'
            inputs:
              command: push
              packagesToPush: '$(dotnetTemplatesArtifactPath)\*.nupkg'
              verbosityPush: 'Detailed'
              nuGetFeedType: 'external'
              publishFeedCredentials: 'NugetOrg'
