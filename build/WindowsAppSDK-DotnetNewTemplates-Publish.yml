#
# Usage:
#   1. Run the OneBranch build pipeline (WindowsAppSDK-DotnetNewTemplates.yml) first.
#   2. Note the build ID from that run.
#   3. Run this pipeline, providing the build ID as a parameter.

trigger: none

resources:
  repositories:
  - repository: templates
    type: git
    name: OneBranch.Pipelines/GovernedTemplates
    ref: refs/heads/main

parameters:
- name: "BuildPipelineId"
  displayName: "Build pipeline definition ID (from WindowsAppSDK-DotnetNewTemplates pipeline)"
  type: number
  default: 186691
- name: "BuildRunId"
  displayName: "Build run ID to download artifact from"
  type: number
- name: "ArtifactName"
  displayName: "Artifact name from the build pipeline"
  type: string
  default: 'drop_DotnetNewTemplates_Build_PackDotnetNewTemplates'

variables:
- template: WindowsAppSDK-CommonVariables.yml

extends:
  template: v2/OneBranch.Official.CrossPlat.yml@templates
  parameters:
    release:
      category: NonAzure
    featureFlags:
      WindowsHostVersion:
        Version: 2022
    stages:
    - stage: DotnetNewTemplates_Prepare
      displayName: 'Prepare dotnet new templates release'
      jobs:
      - job: PrepareReleaseArtifact
        displayName: 'Prepare verified NuGet package'
        pool:
          type: windows
        variables:
          ob_outputDirectory: '$(Build.ArtifactStagingDirectory)'
          ob_artifactBaseName: 'DotnetNewTemplatesReleasePackages'
          dotnetTemplatesArtifactPath: '$(Pipeline.Workspace)\BuildArtifact'
        steps:
        - checkout: none

        - task: DownloadPipelineArtifact@2
          displayName: 'Download official dotnet new templates artifact'
          inputs:
            source: 'specific'
            project: '$(System.TeamProjectId)'
            pipeline: ${{ parameters.BuildPipelineId }}
            runVersion: 'specific'
            runId: ${{ parameters.BuildRunId }}
            artifact: '${{ parameters.ArtifactName }}'
            targetPath: '$(dotnetTemplatesArtifactPath)'
            patterns: |
              **/*.nupkg

        - task: PowerShell@2
          displayName: 'Verify NuGet release package'
          inputs:
            targetType: inline
            script: |
              $packages = @(Get-ChildItem -Path '$(dotnetTemplatesArtifactPath)' -Filter '*.nupkg' -File -Recurse)
              if ($packages.Count -ne 1) {
                throw "Expected exactly one dotnet template package; found $($packages.Count)."
              }

              Write-Host "Verifying package $($packages[0].FullName)"
              & nuget.exe verify $packages[0].FullName -All
              if ($LASTEXITCODE -ne 0) {
                throw "NuGet signature verification failed for $($packages[0].FullName)."
              }

        - task: CopyFiles@2
          displayName: 'Stage verified release package'
          inputs:
            SourceFolder: '$(dotnetTemplatesArtifactPath)'
            Contents: '**/*.nupkg'
            TargetFolder: '$(ob_outputDirectory)'

    - stage: DotnetNewTemplates_Publish
      displayName: 'Publish dotnet new templates to NuGet.org'
      dependsOn:
      - DotnetNewTemplates_Prepare
      variables:
        ob_release_environment: Production
      jobs:
      - job: WaitForPublishApproval
        displayName: 'Manual Approval'
        pool:
          type: server
        timeoutInMinutes: 1440
        steps:
        - task: ManualValidation@0
          displayName: 'Verify artifacts before NuGet.org publish'
          timeoutInMinutes: 1440
          inputs:
            notifyUsers: ''
            instructions: 'Verify the DotnetNewTemplatesReleasePackages artifact before publishing it to NuGet.org.'

      - job: PublishNuGetOrg
        displayName: 'Publish dotnet new template pack to NuGet.org'
        dependsOn: WaitForPublishApproval
        pool:
          type: release
        templateContext:
          inputs:
          - input: pipelineArtifact
            artifactName: DotnetNewTemplatesReleasePackages
            targetPath: '$(Build.SourcesDirectory)\VerifiedReleasePackages'
            itemPattern: |
              **/*.nupkg
        steps:
        - task: NuGetCommand@2
          displayName: 'Publish dotnet new templates to NuGet.org'
          inputs:
            command: 'push'
            packagesToPush: '$(Build.SourcesDirectory)\VerifiedReleasePackages\**\*.nupkg'
            verbosityPush: 'Detailed'
            nuGetFeedType: 'external'
            publishFeedCredentials: 'NugetOrg'
