#
# Standalone OneBranch release pipeline for publishing dotnet new templates to NuGet.org.
# Packages are staged in a build job, approved, then published from the governed release pool.
#
# Usage:
#   1. Run the OneBranch build pipeline (WindowsAppSDK-DotnetNewTemplates.yml) first.
#   2. Note the build ID from that run.
#   3. Run this pipeline, providing the build ID as a parameter.
#   4. Review the staged packages and approve the NuGet.org publish.

trigger: none
pr: none

parameters:
- name: "BuildPipelineId"
  displayName: "Build pipeline definition ID (from WindowsAppSDK-DotnetNewTemplates pipeline)"
  type: number
  default: 202202
- name: "BuildRunId"
  displayName: "Build run ID to download artifact from"
  type: number
- name: "ArtifactName"
  displayName: "Artifact name from the build pipeline"
  type: string
  default: 'drop_DotnetNewTemplates_Build_PackDotnetNewTemplates'

resources:
  repositories:
  - repository: templates
    type: git
    name: OneBranch.Pipelines/GovernedTemplates
    ref: refs/heads/main

extends:
  template: v2/OneBranch.Official.CrossPlat.yml@templates
  parameters:
    release:
      category: NonAzure
    featureFlags:
      WindowsHostVersion:
        Version: 2022

    stages:
    - stage: DotnetNewTemplates_Prepare
      displayName: 'Prepare dotnet new template pack for release'
      jobs:
      - job: PrepareTemplatePackages
        displayName: 'Stage dotnet new template pack'
        pool:
          type: windows
        variables:
          ob_outputDirectory: '$(Build.ArtifactStagingDirectory)\dotnet-new-template-pack'
          ob_artifactBaseName: 'DotnetNewTemplatePackages'
          WindowsContainerImage: 'onebranch.azurecr.io/windows/ltsc2022/vse2022:latest'
        steps:
        - task: DownloadPipelineArtifact@2
          displayName: 'Download dotnet new template pack artifact'
          inputs:
            source: specific
            project: '$(System.TeamProjectId)'
            definition: ${{ parameters.BuildPipelineId }}
            runVersion: specific
            pipelineId: ${{ parameters.BuildRunId }}
            artifact: '${{ parameters.ArtifactName }}'
            path: '$(ob_outputDirectory)'
            patterns: '*.nupkg'

        - task: PowerShell@2
          displayName: 'Verify staged dotnet new template pack'
          inputs:
            targetType: inline
            script: |
              Set-StrictMode -Version 2.0
              $ErrorActionPreference = 'Stop'

              $artifactPath = '$(ob_outputDirectory)'
              if (-not (Test-Path -LiteralPath $artifactPath -PathType Container)) {
                throw "Expected artifact directory '$artifactPath' was not found."
              }
              $packages = Get-ChildItem -LiteralPath $artifactPath -Filter *.nupkg -File
              if (-not $packages) {
                throw "No root-level .nupkg files were found in '$artifactPath'."
              }
              Write-Host "Found the following packages ready for approval:"
              $packages | ForEach-Object {
                $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
                Write-Host " - $($_.Name) SHA256: $($hash.Hash)"
              }

    - stage: DotnetNewTemplates_Publish
      displayName: 'Approve and publish dotnet new templates to NuGet.org'
      dependsOn:
      - DotnetNewTemplates_Prepare
      variables:
        ob_release_environment: Production
      jobs:
      - job: WaitForPublishApproval
        displayName: 'Manual Approval'
        pool:
          type: server
        timeoutInMinutes: 1441
        steps:
        - task: ManualValidation@0
          displayName: 'Verify artifacts before NuGet.org publish'
          timeoutInMinutes: 1440
          inputs:
            notifyUsers: ''
            onTimeout: reject
            instructions: |
              Please verify the .nupkg in the ${{ parameters.ArtifactName }} folder before continuing the publish to NuGet.org:
              $(System.CollectionUri)$(System.TeamProjectId)/_build/results?buildId=${{ parameters.BuildRunId }}&view=artifacts&pathAsName=false&type=publishedArtifacts
              The selected packages are staged in the DotnetNewTemplatePackages artifact of this release run:
              $(System.CollectionUri)$(System.TeamProjectId)/_build/results?buildId=$(Build.BuildId)&view=artifacts&pathAsName=false&type=publishedArtifacts

      - job: PublishNuGetOrg
        displayName: 'Publish dotnet new template pack to NuGet.org'
        dependsOn:
        - WaitForPublishApproval
        pool:
          type: release
        variables:
          dotnetTemplatesArtifactPath: '$(Pipeline.Workspace)\BuildArtifact'
        templateContext:
          inputs:
          - input: pipelineArtifact
            artifactName: 'DotnetNewTemplatePackages'
            targetPath: '$(dotnetTemplatesArtifactPath)'
            itemPattern: '*.nupkg'
        steps:
        - task: PowerShell@2
          displayName: 'Verify dotnet new template pack artifact exists'
          inputs:
            targetType: inline
            script: |
              Set-StrictMode -Version 2.0
              $ErrorActionPreference = 'Stop'

              $artifactPath = '$(dotnetTemplatesArtifactPath)'
              if (-not (Test-Path -LiteralPath $artifactPath -PathType Container)) {
                throw "Expected artifact directory '$artifactPath' was not found."
              }
              $packages = Get-ChildItem -LiteralPath $artifactPath -Filter *.nupkg -File
              if (-not $packages) {
                throw "No root-level .nupkg files were found in '$artifactPath'."
              }
              Write-Host "Found the following packages ready for publish:"
              $packages | ForEach-Object {
                $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
                Write-Host " - $($_.Name) SHA256: $($hash.Hash)"
              }

        - task: NuGetCommand@2
          displayName: 'Publish dotnet new templates to NuGet.org'
          inputs:
            command: push
            packagesToPush: '$(dotnetTemplatesArtifactPath)\*.nupkg'
            verbosityPush: 'Detailed'
            nuGetFeedType: 'external'
            publishFeedCredentials: 'NugetOrg'
