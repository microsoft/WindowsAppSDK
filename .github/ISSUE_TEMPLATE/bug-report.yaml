name: Bug report
description: File a bug report
title: "Bug title"
labels: []
body:
  - type: markdown
    attributes:
      value: |
        For bugs related to WinUI, please open a bug on the [Microsoft.UI.Xaml repository](https://github.com/microsoft/microsoft-ui-xaml)
        Please provide the title, description, and reproduction steps in English. Thank you!
  - type: textarea
    validations:
      required: true
    attributes:
      label: Describe the bug
      description: Please enter a short, clear description of the bug.
  - type: textarea
    validations:
      required: true
    attributes:
      label: Steps to reproduce the bug
      description: Please provide any required setup and steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
  - type: textarea
    attributes:
      label: Expected behavior
      description: Please provide a description of what you expected to happen
  - type: textarea
    attributes:
      label: Screenshots
      description: If applicable, add screenshots here to help explain your problem
  - type: input
    validations:
      required: true
    attributes:
      label: NuGet package version
      description: "Enter the Windows App SDK NuGet package version you're using (e.g., 1.8.260317003). You can find this in your project's packages.config or .csproj file."
      placeholder: "e.g., 1.8.260317003"
  - type: dropdown
    attributes:
      label: Packaging type
      description: Please specify the packaging type you're using when you encountered the issue.
      multiple: true
      options:
        - "Packaged (MSIX)"
        - "Unpackaged"
  - type: dropdown
    attributes:
      label: Windows edition
      description: Which Windows edition are you using?
      multiple: false
      options:
        - "Windows"
        - "Windows Server"
  - type: input
    attributes:
      label: Windows version and build
      description: "Run winver and paste the version and OS build it reports (e.g., 24H2, OS Build 26100.2314)."
      placeholder: "e.g., 24H2 (OS Build 26100.2314)"
  - type: dropdown
    attributes:
      label: IDE
      description: Which IDE are you using?
      multiple: true
      options:
        - "Visual Studio 2022-preview"
        - "Visual Studio 2022"
        - "Visual Studio 2019"
        - "Other"
  - type: textarea
    attributes:
      label: Additional context
      description: Enter any other applicable info here
